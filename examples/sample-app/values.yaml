# Base values for all environments
replicaCount: 1

image:
  repository: nginx
  tag: "1.21"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Unused values - not referenced in templates
database:
  host: "localhost"
  port: 5432
  username: "admin"
  password: "changeme"

# Another unused value
monitoring:
  enabled: false
  endpoint: "http://metrics.example.com"

# Used value
environment: base

# Unused nested value
cache:
  redis:
    host: "redis.example.com"
    port: 6379
