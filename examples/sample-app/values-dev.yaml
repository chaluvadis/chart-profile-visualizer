# Development environment overrides
replicaCount: 2

image:
  tag: "latest"

ingress:
  enabled: true
  hosts:
    - host: dev.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Unused dev-only settings
debug:
  enabled: true
  logLevel: "verbose"
  verbose: true

# Unused feature flags
features:
  newUI: true
  betaAPI: false

# Used environment setting
environment: dev
