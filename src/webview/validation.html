<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'nonce-{{{nonce}}}'; script-src 'nonce-{{{nonce}}}'">
    <title>Validation Results</title>
    <style nonce="{{{nonce}}}">
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--vscode-font-family);
            color: var(--vscode-foreground);
            background-color: var(--vscode-editor-background);
            padding: 0;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: var(--vscode-editor-lineHighlightBackground);
            border-bottom: 1px solid var(--vscode-focusBorder);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 18px;
        }
        .status-icon.valid { background: rgba(63, 185, 80, 0.15); color: #3fb950; }
        .status-icon.invalid { background: rgba(248, 81, 73, 0.15); color: #f85149; }
        .status-icon.attention { background: rgba(210, 153, 34, 0.15); color: #d29922; }
        .header-title h2 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .header-title p { font-size: 11px; color: var(--vscode-descriptionForeground); }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn:hover { background: var(--vscode-button-hoverBackground); }
        .btn-icon { font-size: 14px; }
        
        .tabs {
            display: flex;
            gap: 4px;
            padding: 10px 20px;
            background: var(--vscode-editor-background);
            border-bottom: 1px solid var(--vscode-editor-lineHighlightBackground);
            overflow-x: auto;
        }
        .tab-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            font-size: 12px;
            color: var(--vscode-foreground);
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn:hover { background: var(--vscode-editor-lineHighlightBackground); }
        .tab-btn.active {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border-color: var(--vscode-focusBorder);
        }
        .tab-btn .count {
            font-size: 10px;
            padding: 1px 5px;
            background: var(--vscode-editor-selectionBackground);
            border-radius: 8px;
        }
        
        .search-row {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            background: var(--vscode-editor-background);
            border-bottom: 1px solid var(--vscode-editor-lineHighlightBackground);
        }
        .search-input {
            flex: 1;
            padding: 6px 10px;
            background: var(--vscode-editor-lineHighlightBackground);
            border: 1px solid var(--vscode-focusBorder);
            border-radius: 4px;
            color: var(--vscode-foreground);
            font-size: 12px;
        }
        .search-input:focus { outline: none; border-color: #58a6ff; }
        
        .main-content {
            padding: 16px 20px;
        }
        
        .chart-group {
            margin-bottom: 16px;
            background: var(--vscode-editor-background);
            border-radius: 8px;
            border: 1px solid var(--vscode-editor-lineHighlightBackground);
            overflow: hidden;
        }
        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--vscode-editor-lineHighlightBackground);
            cursor: pointer;
        }
        .chart-header:hover { background: var(--vscode-editor-selectionBackground); }
        .chart-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chart-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(88, 166, 255, 0.15);
            color: #58a6ff;
            border-radius: 4px;
            font-size: 14px;
        }
        .chart-title {
            font-size: 13px;
            font-weight: 600;
        }
        .chart-subtitle {
            font-size: 10px;
            color: var(--vscode-descriptionForeground);
            margin-top: 1px;
        }
        .chevron {
            font-size: 10px;
            color: var(--vscode-descriptionForeground);
            transition: transform 0.2s ease;
            margin-right: 8px;
        }
        .chevron.collapsed { transform: rotate(-90deg); }
        
        .chart-files { display: block; }
        .chart-files.collapsed { display: none; }
        
        .file-logs { display: block; }
        .file-logs.collapsed { display: none; }

        .log-items { display: block; }
        .log-items.collapsed { display: none; }
        
        .file-group {
            border-top: 1px solid var(--vscode-editor-lineHighlightBackground);
        }
        .file-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--vscode-editor-background);
            cursor: pointer;
        }
        .file-header:hover { background: var(--vscode-list-hoverBackground); }
        .file-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .file-icon {
            font-size: 13px;
            color: var(--vscode-descriptionForeground);
        }
        .file-name {
            font-size: 12px;
            font-weight: 500;
        }
        .file-meta {
            font-size: 11px;
            color: var(--vscode-descriptionForeground);
        }
        .jump-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
        }
        .jump-btn:hover { background: var(--vscode-button-hoverBackground); }
        
        .log-group {
            background: var(--vscode-editor-lineHighlightBackground);
        }
        .log-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
        }
        .log-header:hover { background: var(--vscode-editor-selectionBackground); }
        .log-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            font-size: 10px;
        }
        .log-icon.error { background: rgba(248, 81, 73, 0.2); color: #f85149; }
        .log-icon.warning { background: rgba(210, 153, 34, 0.2); color: #d29922; }
        .log-icon.info { background: rgba(88, 166, 255, 0.2); color: #58a6ff; }
        .log-label {
            flex: 1;
        }
        .log-count {
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 8px;
            font-weight: 600;
        }
        .log-count.error { background: rgba(248, 81, 73, 0.15); color: #f85149; }
        .log-count.warning { background: rgba(210, 153, 34, 0.15); color: #d29922; }
        .log-count.info { background: rgba(88, 166, 255, 0.15); color: #58a6ff; }
        
        .log-items {
            padding: 0 14px 12px;
        }
        .log-item {
            padding: 8px 10px;
            margin-top: 6px;
            background: var(--vscode-editor-background);
            border-radius: 4px;
            border-left: 2px solid;
        }
        .log-item.error { border-left-color: #f85149; }
        .log-item.warning { border-left-color: #d29922; }
        .log-item.info { border-left-color: #58a6ff; }
        .log-message {
            font-size: 11px;
            line-height: 1.4;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--vscode-descriptionForeground);
        }
        .empty-icon { font-size: 36px; margin-bottom: 10px; }
        .empty-title { font-size: 13px; font-weight: 600; color: var(--vscode-foreground); margin-bottom: 4px; }
        .empty-text { font-size: 11px; }
        
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: var(--vscode-editor-lineHighlightBackground);
            border-top: 1px solid var(--vscode-focusBorder);
            font-size: 10px;
            color: var(--vscode-descriptionForeground);
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .status-item {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 6px;
            background: var(--vscode-editor-background);
            border-radius: 3px;
        }
        
        .status-label {
            color: var(--vscode-descriptionForeground);
            font-weight: 500;
        }
        
        .status-item.error .status-label,
        .status-item.error {
            color: #f85149;
        }
        
        .status-item.warning .status-label,
        .status-item.warning {
            color: #d29922;
        }
        
        .status-item.status-value {
            font-weight: 600;
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }
        
        .footer-info {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 10px;
            color: var(--vscode-descriptionForeground);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="status-icon {{statusClass}}">{{statusIcon}}</div>
            <div class="header-title">
                <h2>{{statusTitle}}</h2>
                <p>{{statusSubtitle}}</p>
            </div>
        </div>
        <div class="header-right">
            <button class="btn" id="refreshBtn"><span class="btn-icon">↻</span> Refresh</button>
            <button class="btn" id="exportBtn"><span class="btn-icon">↓</span> Export</button>
        </div>
    </div>

    <div class="tabs" id="categoryTabs"></div>

    <div class="search-row">
        <input type="text" class="search-input" id="searchInput" placeholder="Search issues...">
    </div>

    <div class="main-content" id="mainContent"></div>

    <div class="footer">
        <div class="status-bar" id="statusBar"></div>
        <div class="footer-info">
            <span>{{chartName}} • {{environment}} • {{totalIssues}} issues • {{timestamp}}</span>
        </div>
    </div>

    <script type="application/json" id="status-data" nonce="{{{nonce}}}">{{{statusBar}}}</script>

    <script type="application/json" id="init-data" nonce="{{{nonce}}}">{{{initData}}}</script>
    <script nonce="{{{nonce}}}">
        var initData = { categories: {}, totalIssues: 0 };
        
        try {
            var el = document.getElementById('init-data');
            if (el && el.textContent) {
                initData = JSON.parse(el.textContent);
            }
        } catch (e) {
            console.error('Failed to parse initData:', e);
        }
        
        var currentCategory = 'all';
        
        var vscodeApi = (typeof acquireVsCodeApi === 'function') ? acquireVsCodeApi() : null;
        
        function postMessage(payload) {
            if (vscodeApi && payload && typeof payload.command === 'string') {
                vscodeApi.postMessage(payload);
                return true;
            }
            return false;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        
        function escapeAttr(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        
        function renderStatusBar() {
            var container = document.getElementById('statusBar');
            var statusDataEl = document.getElementById('status-data');
            if (!container || !statusDataEl) return;
            
            try {
                var statusBar = JSON.parse(statusDataEl.textContent || '{}');
                if (!statusBar || Object.keys(statusBar).length === 0) {
                    container.innerHTML = '<span class="status-item">No data</span>';
                    return;
                }
                
                var html = '';
                if (statusBar.totalCharts !== undefined) {
                    html += '<span class="status-item"><span class="status-label">Charts:</span> ' + statusBar.totalCharts + '</span>';
                }
                if (statusBar.totalFiles !== undefined) {
                    html += '<span class="status-item"><span class="status-label">Files:</span> ' + statusBar.totalFiles + '</span>';
                }
                if (statusBar.totalLogs !== undefined) {
                    html += '<span class="status-item"><span class="status-label">Total:</span> ' + statusBar.totalLogs + '</span>';
                }
                if (statusBar.errorCount !== undefined) {
                    html += '<span class="status-item error"><span class="status-label">Errors:</span> ' + statusBar.errorCount + '</span>';
                }
                if (statusBar.warningCount !== undefined) {
                    html += '<span class="status-item warning"><span class="status-label">Warnings:</span> ' + statusBar.warningCount + '</span>';
                }
                if (statusBar.status) {
                    html += '<span class="status-item status-value">' + statusBar.status + '</span>';
                }
                
                container.innerHTML = html;
            } catch (e) {
                console.error('Failed to parse status data:', e);
                container.innerHTML = '<span class="status-item">Error loading status</span>';
            }
        }
        
        function init() {
            renderStatusBar();
            renderTabs();
            renderMainContent();
            
            document.getElementById('searchInput').addEventListener('input', function(e) {
                e.preventDefault();
                renderMainContent();
            });
            document.getElementById('refreshBtn').addEventListener('click', function(e) {
                e.preventDefault();
                postMessage({ command: 'refreshValidation' });
            });
            document.getElementById('exportBtn').addEventListener('click', function(e) {
                e.preventDefault();
                try {
                    exportResults();
                } catch (err) {
                    console.error('Export error:', err);
                    alert('Export failed: ' + err.message);
                }
            });
        }
        
        function renderTabs() {
            var tabs = initData.categories || {};
            var container = document.getElementById('categoryTabs');
            var total = initData.totalIssues || 0;
            
            var html = '<button class="tab-btn active" data-category="all">All <span class="count">' + total + '</span></button>';
            
            Object.keys(tabs).forEach(function(cat) {
                var items = tabs[cat] || [];
                if (items.length > 0) {
                    var label = cat.charAt(0).toUpperCase() + cat.slice(1);
                    html += '<button class="tab-btn" data-category="' + cat + '">' + label + ' <span class="count">' + items.length + '</span></button>';
                }
            });
            
            container.innerHTML = html;
            
            container.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    currentCategory = e.currentTarget.getAttribute('data-category');
                    container.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
                    e.currentTarget.classList.add('active');
                    renderMainContent();
                });
            });
        }
        
        function getFilteredIssues() {
            var search = document.getElementById('searchInput').value.toLowerCase();
            var tabs = initData.categories || {};
            var issues = [];
            
            if (currentCategory === 'all') {
                Object.keys(tabs).forEach(function(cat) {
                    issues = issues.concat(tabs[cat] || []);
                });
            } else {
                issues = tabs[currentCategory] || [];
            }
            
            if (search) {
                issues = issues.filter(function(i) {
                    return (i.message || '').toLowerCase().indexOf(search) !== -1 ||
                           (i.code || '').toLowerCase().indexOf(search) !== -1;
                });
            }
            
            return issues;
        }
        
        function getLogIcon(severity) {
            var icons = { error: '✗', warning: '⚠', info: 'i' };
            return icons[severity] || '?';
        }
        
        function getFileIcon(fileName) {
            if (!fileName) return '📄';
            var ext = fileName.split('.').pop().toLowerCase();
            var icons = {
                'yaml': '📝', 'yml': '📝',
                'json': '📋',
                'tpl': '📰',
                'txt': '📃',
                'sh': '⚡',
                'lua': '🌙'
            };
            return icons[ext] || '📄';
        }
        
        function buildHierarchy(issues) {
            var chartMap = {};
            
            issues.forEach(function(issue) {
                var chartPath = issue.chartPath || issue.file || 'unknown';
                var filePath = issue.file || 'unknown';
                var chartKey = chartPath;
                var fileKey = chartPath + '||' + filePath;
                
                if (!chartMap[chartKey]) {
                    chartMap[chartKey] = {
                        chartPath: chartPath,
                        chartName: chartPath.split(/[/\\]/).pop() || chartPath,
                        files: {}
                    };
                }
                
                if (!chartMap[chartKey].files[fileKey]) {
                    chartMap[chartKey].files[fileKey] = {
                        filePath: filePath,
                        fileName: filePath.split(/[/\\]/).pop() || filePath,
                        logs: { error: [], warning: [], info: [] }
                    };
                }
                
                var severity = issue.severity || 'info';
                if (chartMap[chartKey].files[fileKey].logs[severity]) {
                    chartMap[chartKey].files[fileKey].logs[severity].push(issue);
                }
            });
            
            return chartMap;
        }
        
        function renderMainContent() {
            var container = document.getElementById('mainContent');
            var issues = getFilteredIssues();
            
            if (issues.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">✓</div><div class="empty-title">No issues found</div><div class="empty-text">No issues match your current filter</div></div>';
                return;
            }
            
            var hierarchy = buildHierarchy(issues);
            var html = '';
            
            Object.keys(hierarchy).forEach(function(chartKey) {
                var chart = hierarchy[chartKey];
                var filesHtml = '';
                
                Object.keys(chart.files).forEach(function(fileKey) {
                    var file = chart.files[fileKey];
                    var logsHtml = '';
                    
                    ['error', 'warning', 'info'].forEach(function(severity) {
                        var logItems = file.logs[severity] || [];
                        if (logItems.length === 0) return;
                        
                        var itemsHtml = logItems.map(function(item) {
                            return '<div class="log-item ' + item.severity + '">' +
                                '<div class="log-message">' + escapeHtml(item.message) + '</div>' +
                            '</div>';
                        }).join('');
                        
                        logsHtml += '<div class="log-group">' +
                            '<div class="log-header" role="button" tabindex="0" aria-expanded="true" aria-label="' + severity + ' items (' + logItems.length + ')">' +
                                '<div class="log-icon ' + severity + '">' + getLogIcon(severity) + '</div>' +
                                '<span class="log-label">' + severity.charAt(0).toUpperCase() + severity.slice(1) + 's</span>' +
                                '<span class="log-count ' + severity + '">' + logItems.length + '</span>' +
                            '</div>' +
                            '<div class="log-items">' + itemsHtml + '</div>' +
                        '</div>';
                    });
                    
                    var jumpBtn = (file.filePath !== 'unknown') ? 
                        '<button class="jump-btn" data-file="' + escapeAttr(file.filePath) + '" data-line="1">↗ Open</button>' : '';
                    
                    var fileSeverity = file.logs.error.length > 0 ? 'error' : file.logs.warning.length > 0 ? 'warning' : 'info';
                    var totalLogs = file.logs.error.length + file.logs.warning.length + file.logs.info.length;
                    
                    filesHtml += '<div class="file-group">' +
                        '<div class="file-header" role="button" tabindex="0" aria-expanded="true" data-file="' + escapeAttr(file.filePath) + '">' +
                            '<div class="file-info">' +
                                '<span class="chevron">▼</span>' +
                                '<span class="file-icon">' + getFileIcon(file.fileName) + '</span>' +
                                '<span class="file-name">' + escapeHtml(file.fileName) + '</span>' +
                                '<span class="file-meta">(' + totalLogs + ' ' + (totalLogs === 1 ? 'issue' : 'issues') + ')</span>' +
                            '</div>' +
                            jumpBtn +
                        '</div>' +
                        '<div class="file-logs">' + logsHtml + '</div>' +
                    '</div>';
                });
                
                html += '<div class="chart-group">' +
                    '<div class="chart-header" role="button" tabindex="0" aria-expanded="true" data-chart="' + escapeAttr(chartKey) + '">' +
                        '<div class="chart-info">' +
                            '<span class="chevron">▼</span>' +
                            '<div class="chart-icon">📦</div>' +
                            '<div>' +
                                '<div class="chart-title">' + escapeHtml(chart.chartName) + '</div>' +
                                '<div class="chart-subtitle">' + escapeHtml(chart.chartPath) + '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="chart-files">' + filesHtml + '</div>' +
                '</div>';
            });
            
            container.innerHTML = html;
            
            container.querySelectorAll('.jump-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var file = this.getAttribute('data-file');
                    var line = parseInt(this.getAttribute('data-line') || '1', 10);
                    if (file) {
                        postMessage({ command: 'jumpToFile', file: file, line: line });
                    }
                });
            });
            
            container.querySelectorAll('.chart-header').forEach(function(header) {
                function toggle() {
                    var group = header.closest('.chart-group');
                    var filesDiv = group.querySelector('.chart-files');
                    var chevron = header.querySelector('.chevron');
                    var expanded = !filesDiv.classList.contains('collapsed');
                    filesDiv.classList.toggle('collapsed');
                    chevron.classList.toggle('collapsed');
                    header.setAttribute('aria-expanded', String(!expanded));
                }
                header.addEventListener('click', toggle);
                header.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
                });
            });
            
            container.querySelectorAll('.file-header').forEach(function(header) {
                function toggle() {
                    var group = header.closest('.file-group');
                    var logsDiv = group.querySelector('.file-logs');
                    var chevron = header.querySelector('.chevron');
                    var expanded = !logsDiv.classList.contains('collapsed');
                    logsDiv.classList.toggle('collapsed');
                    chevron.classList.toggle('collapsed');
                    header.setAttribute('aria-expanded', String(!expanded));
                }
                header.addEventListener('click', toggle);
                header.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
                });
            });

            container.querySelectorAll('.log-header').forEach(function(header) {
                function toggle() {
                    var group = header.closest('.log-group');
                    var itemsDiv = group.querySelector('.log-items');
                    var expanded = !itemsDiv.classList.contains('collapsed');
                    itemsDiv.classList.toggle('collapsed');
                    header.setAttribute('aria-expanded', String(!expanded));
                }
                header.addEventListener('click', toggle);
                header.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
                });
            });
        }
        
        function exportResults() {
            var issues = getFilteredIssues();
            var hierarchy = buildHierarchy(issues);
            
            var exportData = {
                charts: Object.keys(hierarchy).map(function(chartKey) {
                    var chart = hierarchy[chartKey];
                    
                    var errorCount = 0;
                    var warningCount = 0;
                    var infoCount = 0;
                    var fileCount = 0;
                    
                    var files = Object.keys(chart.files).map(function(fileKey) {
                        var file = chart.files[fileKey];
                        
                        var fileErrorCount = file.logs.error.length;
                        var fileWarningCount = file.logs.warning.length;
                        var fileInfoCount = file.logs.info.length;
                        
                        errorCount += fileErrorCount;
                        warningCount += fileWarningCount;
                        infoCount += fileInfoCount;
                        fileCount++;
                        
                        var logTypes = [];
                        
                        if (fileErrorCount > 0) {
                            logTypes.push({
                                type: 'error',
                                count: fileErrorCount,
                                logs: file.logs.error.map(function(log) {
                                    return {
                                        message: log.message || '',
                                        severity: log.severity || 'error',
                                        sourceLine: log.line || null,
                                        details: {}
                                    };
                                })
                            });
                        }
                        
                        if (fileWarningCount > 0) {
                            logTypes.push({
                                type: 'warning',
                                count: fileWarningCount,
                                logs: file.logs.warning.map(function(log) {
                                    return {
                                        message: log.message || '',
                                        severity: log.severity || 'warning',
                                        sourceLine: log.line || null,
                                        details: {}
                                    };
                                })
                            });
                        }
                        
                        if (fileInfoCount > 0) {
                            logTypes.push({
                                type: 'info',
                                count: fileInfoCount,
                                logs: file.logs.info.map(function(log) {
                                    return {
                                        message: log.message || '',
                                        severity: log.severity || 'info',
                                        sourceLine: log.line || null,
                                        details: {}
                                    };
                                })
                            });
                        }
                        
                        return {
                            fileName: file.fileName,
                            filePath: file.filePath,
                            summary: {
                                logCount: fileErrorCount + fileWarningCount + fileInfoCount,
                                errorCount: fileErrorCount,
                                warningCount: fileWarningCount,
                                infoCount: fileInfoCount
                            },
                            logTypes: logTypes
                        };
                    });
                    
                    return {
                        chartName: chart.chartName,
                        chartPath: chart.chartPath,
                        summary: {
                            fileCount: fileCount,
                            logCount: errorCount + warningCount + infoCount,
                            errorCount: errorCount,
                            warningCount: warningCount,
                            infoCount: infoCount
                        },
                        files: files
                    };
                })
            };
            
            var jsonStr = JSON.stringify(exportData, null, 2);
            var blob = new Blob([jsonStr], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            
            var a = document.createElement('a');
            a.href = url;
            a.download = 'validation-results.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
