<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
    <title>Validation Results</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--vscode-font-family);
            color: var(--vscode-foreground);
            background-color: var(--vscode-editor-background);
            padding: 0;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--vscode-editor-lineHighlightBackground);
            border-bottom: 1px solid var(--vscode-focusBorder);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .status-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 22px;
        }
        .status-icon.valid { background: rgba(63, 185, 80, 0.15); color: #3fb950; }
        .status-icon.invalid { background: rgba(248, 81, 73, 0.15); color: #f85149; }
        .status-icon.attention { background: rgba(210, 153, 34, 0.15); color: #d29922; }
        .header-title h2 { font-size: 17px; font-weight: 600; margin-bottom: 2px; }
        .header-title p { font-size: 12px; color: var(--vscode-descriptionForeground); }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn:hover { background: var(--vscode-button-hoverBackground); }
        
        .tabs {
            display: flex;
            gap: 4px;
            padding: 10px 20px;
            background: var(--vscode-editor-background);
            border-bottom: 1px solid var(--vscode-editor-lineHighlightBackground);
            overflow-x: auto;
        }
        .tab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            font-size: 13px;
            color: var(--vscode-foreground);
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn:hover { background: var(--vscode-editor-lineHighlightBackground); }
        .tab-btn.active {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border-color: var(--vscode-focusBorder);
        }
        .tab-btn .count {
            font-size: 11px;
            padding: 2px 6px;
            background: var(--vscode-editor-selectionBackground);
            border-radius: 10px;
        }
        
        .compact-view {
            padding: 16px 20px;
            background: var(--vscode-editor-lineHighlightBackground);
            border-bottom: 1px solid var(--vscode-focusBorder);
        }
        .compact-status {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .compact-status.valid { color: #3fb950; }
        .compact-status.invalid { color: #f85149; }
        .compact-status.attention { color: #d29922; }
        .compact-summary {
            font-size: 13px;
            color: var(--vscode-descriptionForeground);
            margin-bottom: 12px;
        }
        .compact-issues {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .compact-issue {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: var(--vscode-editor-background);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .compact-issue:hover { background: var(--vscode-editor-selectionBackground); }
        .compact-issue .path {
            color: var(--vscode-foreground);
            font-weight: 500;
        }
        .compact-issue .message {
            color: var(--vscode-descriptionForeground);
            flex: 1;
        }
        
        .summary-row {
            display: flex;
            gap: 12px;
            padding: 14px 20px;
            background: var(--vscode-editor-background);
            border-bottom: 1px solid var(--vscode-editor-lineHighlightBackground);
            overflow-x: auto;
        }
        .summary-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--vscode-editor-lineHighlightBackground);
            border-radius: 6px;
            min-width: 90px;
        }
        .summary-card .count { font-size: 18px; font-weight: 700; }
        .summary-card .label { font-size: 11px; color: var(--vscode-descriptionForeground); }
        .summary-card.error .count { color: #f85149; }
        .summary-card.warning .count { color: #d29922; }
        .summary-card.info .count { color: #58a6ff; }
        
        .search-row {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            background: var(--vscode-editor-background);
            border-bottom: 1px solid var(--vscode-editor-lineHighlightBackground);
        }
        .search-input {
            flex: 1;
            padding: 8px 12px;
            background: var(--vscode-editor-lineHighlightBackground);
            border: 1px solid var(--vscode-focusBorder);
            border-radius: 4px;
            color: var(--vscode-foreground);
            font-size: 12px;
        }
        .search-input:focus { outline: none; border-color: #58a6ff; }
        
        .issues-list {
            padding: 16px 20px;
        }
        
        .issue-card {
            padding: 12px 14px;
            margin-bottom: 8px;
            background: var(--vscode-editor-lineHighlightBackground);
            border-radius: 6px;
            border-left: 3px solid;
        }
        .issue-card.error { border-left-color: #f85149; }
        .issue-card.warning { border-left-color: #d29922; }
        .issue-card.info { border-left-color: #58a6ff; }
        
        .issue-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .issue-code {
            font-size: 10px;
            padding: 2px 6px;
            background: var(--vscode-editor-background);
            border-radius: 3px;
            font-family: var(--vscode-editor-font-family);
            color: var(--vscode-descriptionForeground);
        }
        .issue-severity {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .issue-severity.error { background: rgba(248, 81, 73, 0.15); color: #f85149; }
        .issue-severity.warning { background: rgba(210, 153, 34, 0.15); color: #d29922; }
        .issue-severity.info { background: rgba(88, 166, 255, 0.15); color: #58a6ff; }
        
        .issue-message {
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        
        .issue-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 11px;
        }
        .meta-tag {
            padding: 2px 6px;
            background: var(--vscode-editor-background);
            border-radius: 3px;
            color: var(--vscode-descriptionForeground);
        }
        .meta-tag.file { cursor: pointer; }
        .meta-tag.file:hover { color: #58a6ff; }
        .meta-tag.remediation { color: #d29922; }
        
        .issue-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--vscode-editor-selectionBackground);
        }
        .action-btn {
            padding: 4px 10px;
            background: var(--vscode-editor-background);
            border: 1px solid var(--vscode-focusBorder);
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            color: var(--vscode-foreground);
        }
        .action-btn:hover { background: var(--vscode-editor-selectionBackground); }
        
        .grouped-issues {
            margin-top: 8px;
            padding: 8px;
            background: var(--vscode-editor-background);
            border-radius: 4px;
        }
        .grouped-issue {
            font-size: 11px;
            padding: 4px 0;
            color: var(--vscode-descriptionForeground);
            border-bottom: 1px solid var(--vscode-editor-lineHighlightBackground);
        }
        .grouped-issue:last-child { border-bottom: none; }
        .issue-count {
            font-size: 12px;
            font-weight: 600;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--vscode-descriptionForeground);
        }
        .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
        .empty-state .title { font-size: 14px; font-weight: 600; color: var(--vscode-foreground); margin-bottom: 6px; }
        .empty-state .text { font-size: 12px; }
        
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--vscode-editor-lineHighlightBackground);
            border-top: 1px solid var(--vscode-focusBorder);
            font-size: 11px;
            color: var(--vscode-descriptionForeground);
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="status-icon {{statusClass}}">{{statusIcon}}</div>
            <div class="header-title">
                <h2>{{statusTitle}}</h2>
                <p>{{statusSubtitle}}</p>
            </div>
        </div>
        <button class="btn" id="refreshBtn">↻ Refresh</button>
    </div>

    <div class="tabs" id="categoryTabs"></div>

    <div class="compact-view" id="compactView">
        <div class="compact-status" id="compactStatus"></div>
        <div class="compact-summary" id="compactSummary"></div>
        <div class="compact-issues" id="compactIssues"></div>
    </div>

    <div class="summary-row">
        <div class="summary-card error">
            <span class="count">{{errorCount}}</span>
            <span class="label">Errors</span>
        </div>
        <div class="summary-card warning">
            <span class="count">{{warningCount}}</span>
            <span class="label">Warnings</span>
        </div>
        <div class="summary-card info">
            <span class="count">{{infoCount}}</span>
            <span class="label">Info</span>
        </div>
    </div>

    <div class="search-row">
        <input type="text" class="search-input" id="searchInput" placeholder="Search issues...">
    </div>

    <div class="issues-list" id="issuesList"></div>

    <div class="footer">
        <span>{{chartName}} • {{environment}}</span>
        <span>{{totalIssues}} issues • {{timestamp}}</span>
    </div>

    <script type="application/json" id="init-data">{{{initData}}}</script>
    <script type="application/json" id="compact-data">{{{compactData}}}</script>
    <script>
        var initData = { categories: {}, totalIssues: 0 };
        var compactData = { status: 'valid', issues: [] };
        
        try {
            var el = document.getElementById('init-data');
            if (el && el.textContent) {
                initData = JSON.parse(el.textContent);
            }
        } catch (e) {
            console.error('Failed to parse initData:', e);
        }
        
        try {
            var compactEl = document.getElementById('compact-data');
            if (compactEl && compactEl.textContent) {
                compactData = JSON.parse(compactEl.textContent);
            }
        } catch (e) {
            console.error('Failed to parse compactData:', e);
        }
        
        var currentCategory = 'all';
        
        var vscodeApi = (typeof acquireVsCodeApi === 'function') ? acquireVsCodeApi() : null;
        
        function postMessage(payload) {
            if (vscodeApi && payload && typeof payload.command === 'string') {
                vscodeApi.postMessage(payload);
                return true;
            }
            return false;
        }
        
        function init() {
            renderTabs();
            renderIssues();
            
            document.getElementById('searchInput').addEventListener('input', renderIssues);
            document.getElementById('refreshBtn').addEventListener('click', function() {
                postMessage({ command: 'refreshValidation' });
            });
        }
        
        function renderTabs() {
            var tabs = initData.categories || {};
            var container = document.getElementById('categoryTabs');
            var total = initData.totalIssues || 0;
            
            var html = '<button class="tab-btn active" data-category="all">All <span class="count">' + total + '</span></button>';
            
            Object.keys(tabs).forEach(function(cat) {
                var items = tabs[cat] || [];
                if (items.length > 0) {
                    var label = cat.charAt(0).toUpperCase() + cat.slice(1);
                    html += '<button class="tab-btn" data-category="' + cat + '">' + label + ' <span class="count">' + items.length + '</span></button>';
                }
            });
            
            container.innerHTML = html;
            
            container.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    currentCategory = this.getAttribute('data-category');
                    container.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    renderIssues();
                });
            });
        }
        
        function getFilteredIssues() {
            var search = document.getElementById('searchInput').value.toLowerCase();
            var tabs = initData.categories || {};
            var issues = [];
            
            if (currentCategory === 'all') {
                Object.keys(tabs).forEach(function(cat) {
                    issues = issues.concat(tabs[cat] || []);
                });
            } else {
                issues = tabs[currentCategory] || [];
            }
            
            if (search) {
                issues = issues.filter(function(i) {
                    return (i.message || '').toLowerCase().indexOf(search) !== -1 ||
                           (i.code || '').toLowerCase().indexOf(search) !== -1;
                });
            }
            
            return issues;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        
        function escapeAttr(str) {
            return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }
        
        function renderIssues() {
            var issues = getFilteredIssues();
            var container = document.getElementById('issuesList');
            
            if (issues.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">✓</div><div class="title">No issues found</div><div class="text">No issues match your current filter</div></div>';
                return;
            }
            
            // For unused category, group by chartPath -> file
            if (currentCategory === 'unused') {
                var grouped = {};
                issues.forEach(function(issue) {
                    var chartKey = issue.chartPath || 'unknown';
                    var fileKey = issue.file || 'unknown';
                    var groupKey = chartKey + '||' + fileKey;
                    
                    if (!grouped[groupKey]) {
                        grouped[groupKey] = {
                            chartPath: chartKey,
                            file: fileKey,
                            issues: []
                        };
                    }
                    grouped[groupKey].issues.push(issue);
                });
                
                var groupKeys = Object.keys(grouped).sort();
                container.innerHTML = groupKeys.map(function(groupKey) {
                    var group = grouped[groupKey];
                    var chartName = group.chartPath.split(/[/\\]/).pop() || group.chartPath;
                    var fileName = group.file.split(/[/\\]/).pop() || group.file;
                    
                    var issuesHtml = group.issues.map(function(issue) {
                        return '<div class="grouped-issue">' + escapeHtml(issue.message) + '</div>';
                    }).join('');
                    
                    var jumpBtn = group.file !== 'unknown' ? '<button class="action-btn" data-file="' + escapeAttr(group.file) + '" data-line="1">➡️ Jump to ' + escapeHtml(fileName) + '</button>' : '';
                    var copyAllBtn = '<button class="action-btn" data-issues="' + escapeAttr(JSON.stringify(group.issues.map(function(i) { return { code: i.code, message: i.message }; }))) + '">📋 Copy All (' + group.issues.length + ')</button>';
                    
                    return '<div class="issue-card ' + group.issues[0].severity + '">' +
                        '<div class="issue-header">' +
                            '<span class="issue-count">' + group.issues.length + ' unused values</span>' +
                            '<span class="issue-severity ' + group.issues[0].severity + '">' + group.issues[0].severity + '</span>' +
                        '</div>' +
                        '<div class="issue-message">' + escapeHtml(chartName) + ' → ' + escapeHtml(fileName) + '</div>' +
                        '<div class="grouped-issues">' + issuesHtml + '</div>' +
                        '<div class="issue-actions">' + copyAllBtn + jumpBtn + '</div>' +
                    '</div>';
                }).join('');
                
                container.querySelectorAll('.action-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var file = this.getAttribute('data-file');
                        var issuesData = this.getAttribute('data-issues');
                        
                        if (file) {
                            postMessage({ command: 'jumpToFile', file: file, line: 1 });
                        }
                        if (issuesData) {
                            try {
                                var parsed = JSON.parse(issuesData);
                                var text = parsed.map(function(i) { return '[' + i.code + '] ' + i.message; }).join('\n');
                                postMessage({ command: 'copyText', text: text });
                            } catch (e) {}
                        }
                    });
                });
                return;
            }
            
            // Default rendering for other categories
            container.innerHTML = issues.map(function(issue) {
                var fileTag = issue.file ? '<span class="meta-tag file" data-file="' + escapeAttr(issue.file) + '" data-line="' + (issue.lineNumber || 1) + '">📄 ' + escapeHtml(issue.fileDisplay || issue.file) + '</span>' : '';
                var remediationTag = issue.remediation ? '<span class="meta-tag remediation">💡 ' + escapeHtml(issue.remediation) + '</span>' : '';
                var copyBtn = '<button class="action-btn" data-code="' + escapeAttr(issue.code) + '" data-message="' + escapeAttr(issue.message) + '">📋 Copy</button>';
                var jumpBtn = issue.file ? '<button class="action-btn" data-file="' + escapeAttr(issue.file) + '" data-line="' + (issue.lineNumber || 1) + '">➡️ Jump</button>' : '';
                
                return '<div class="issue-card ' + issue.severity + '">' +
                    '<div class="issue-header">' +
                        '<span class="issue-code">' + escapeHtml(issue.code) + '</span>' +
                        '<span class="issue-severity ' + issue.severity + '">' + issue.severity + '</span>' +
                    '</div>' +
                    '<div class="issue-message">' + escapeHtml(issue.message) + '</div>' +
                    '<div class="issue-meta">' + fileTag + remediationTag + '</div>' +
                    '<div class="issue-actions">' + copyBtn + jumpBtn + '</div>' +
                '</div>';
            }).join('');
            
            container.querySelectorAll('.action-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var code = this.getAttribute('data-code');
                    var message = this.getAttribute('data-message');
                    var file = this.getAttribute('data-file');
                    var line = parseInt(this.getAttribute('data-line') || '1', 10);
                    
                    if (code && message) {
                        postMessage({ command: 'copyText', text: '[' + code + '] ' + message });
                    }
                    if (file) {
                        postMessage({ command: 'jumpToFile', file: file, line: line });
                    }
                });
            });
            
            container.querySelectorAll('.meta-tag.file').forEach(function(tag) {
                tag.addEventListener('click', function() {
                    var file = this.getAttribute('data-file');
                    var line = parseInt(this.getAttribute('data-line') || '1', 10);
                    postMessage({ command: 'jumpToFile', file: file, line: line });
                });
            });
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
